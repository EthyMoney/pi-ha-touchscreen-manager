<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Starting dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #fff;
      background: #0c1118;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .spinner {
      width: 58px;
      height: 58px;
      margin: 0 auto 22px;
      border: 6px solid #253242;
      border-top-color: #36a9ff;
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { margin: 0; color: #aeb8c5; font-size: 17px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <h1>Starting Home Assistant</h1>
    <p>Checking the local network…</p>
  </div>
  <script>
    fetch('/api/dashboard/status', { cache: 'no-store' })
      .then((response) => response.json())
      .then((status) => {
        window.location.replace(status.reachable
          ? status.homeAssistantUrl
          : '/wifi?reason=startup');
      })
      .catch(() => window.location.replace('/wifi?reason=startup'));
  </script>
</body>
</html>
